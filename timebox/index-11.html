<title>Nicholas Walton Portfolio</title>
<meta name="description" content="Software engineer building web applications, backend systems and infrastructure.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: light editorial one-pager. Deep green header and footer with a yellow ring mark, square hairline grid, mono labels. Single light look by choice. */
:root{
  --bg:#ffffff; --ink:hsl(165 30% 8%); --card:#ffffff; --secondary:hsl(150 14% 94%); --band:hsl(150 14% 96%);
  --muted:hsl(165 8% 35%); --line:hsl(150 10% 85%);
  --green:hsl(159 59% 19%); --green-d:hsl(159 62% 14%); --green-2:hsl(158 58% 32%); --gold:hsl(43 77% 54%);
  --on-green:#ffffff; --danger:hsl(0 68% 42%); --ok:hsl(150 55% 28%);
  --tile-hover:hsl(150 14% 94%);
  --font-sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --nav-h:80px; --ease:cubic-bezier(.22,.8,.3,1);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.6;
  padding-block:0;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--green)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
img{max-width:100%;display:block}
h1,h2,h3,p,figure{margin:0}
:focus-visible{outline:2px solid var(--green-2);outline-offset:2px}
.hdr :focus-visible,footer :focus-visible,.shbar :focus-visible{outline-color:var(--gold)}
.wrap{max-width:1152px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--font-mono);font-size:10px;line-height:1.5;text-transform:uppercase;letter-spacing:.18em;font-weight:500}
.muted{color:var(--muted)}
.ring{width:22px;height:22px;color:var(--gold);flex:none}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;height:var(--nav-h);background:var(--green);color:var(--on-green)}
.hdr-in{height:100%;display:flex;align-items:center;gap:32px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;margin-right:auto}
.bname{font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.2;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logoimg{width:40px;height:40px;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden}
.logoimg img{width:100%;height:100%;object-fit:contain;padding:5px}
.dnav{display:none;align-items:center;gap:32px}
.navl{position:relative;padding:6px 0;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:rgba(255,255,255,.76);transition:color .25s ease}
.navl::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.navl:hover{color:#fff}.navl:hover::after{transform:scaleX(1)}
.btn-out{display:inline-flex;align-items:center;height:40px;padding:0 18px;border:1px solid rgba(255,255,255,.55);color:#fff;
  font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.14em;transition:background .25s ease,color .25s ease,border-color .25s ease}
.btn-out:hover{background:var(--gold);border-color:var(--gold);color:var(--green-d)}
.burger{position:relative;width:40px;height:40px;border:1px solid rgba(255,255,255,.4);color:#fff;transition:background .25s ease,border-color .25s ease}
.burger:hover{background:rgba(255,255,255,.08)}
.burger svg{position:absolute;left:11px;top:11px;width:18px;height:18px;transition:opacity .25s ease,transform .35s var(--ease)}
.burger .x{opacity:0;transform:rotate(-90deg) scale(.7)}
.burger[aria-expanded="true"] .x{opacity:1;transform:none}
.burger[aria-expanded="true"] .m{opacity:0;transform:rotate(90deg) scale(.7)}
.mpanel{position:absolute;left:0;right:0;top:100%;background:var(--green-d);display:grid;grid-template-rows:0fr;opacity:0;visibility:hidden;transform:translateY(-8px);
  transition:grid-template-rows .34s var(--ease),opacity .26s ease,transform .34s var(--ease),visibility 0s linear .34s}
.mpanel.open{grid-template-rows:1fr;opacity:1;visibility:visible;transform:none;transition-delay:0s}
.mpanel-in{overflow:hidden;min-height:0}
.mpanel a{display:block;padding:18px max(24px,env(safe-area-inset-left,0px));border-top:1px solid rgba(255,255,255,.12);
  font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:rgba(255,255,255,.8);transition:background .2s ease,color .2s ease,padding-left .25s var(--ease)}
.mpanel a:hover{background:rgba(255,255,255,.06);color:var(--gold);padding-left:calc(max(24px,env(safe-area-inset-left,0px)) + 6px)}
@media (min-width:768px){.dnav{display:flex}.burger,.mpanel{display:none!important}}

/* sections */
section,footer{border-top:1px solid var(--line)}
.sec{padding-block:clamp(64px,8vw,96px);scroll-margin-top:calc(var(--nav-h) + env(safe-area-inset-top,0px))}
.sec.band{background:var(--band)}
.intro{display:flex;flex-direction:column;gap:20px;margin-bottom:56px}
.eyebrow{display:flex;align-items:center;gap:10px;color:var(--muted)}
.eyebrow i{display:block;width:8px;height:2px;background:var(--gold)}
.intro-row{display:flex;flex-direction:column;gap:20px}
h2{font-size:clamp(1.875rem,5vw,3rem);font-weight:600;letter-spacing:-.035em;line-height:1.02;text-wrap:balance}
.intro p.lead{color:var(--muted);max-width:26rem;font-size:15px}
@media (min-width:768px){.intro-row{flex-direction:row;align-items:flex-end;justify-content:space-between;gap:48px}
  .intro p.lead{text-align:right}}

/* hero */
.hero{border-top:0;padding-block:clamp(56px,7vw,88px);text-align:left;background:var(--green);color:#fff}
.hero .eyebrow{justify-content:flex-start;color:var(--gold);margin-bottom:28px}
.hero .figcap{color:rgba(255,255,255,.75)}
.hero .figbtn{border-color:rgba(255,255,255,.25)}
.hero .ph{border-color:rgba(255,255,255,.45);color:#fff;background:rgba(255,255,255,.08)}
.hero-btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
.hbtn{display:inline-flex;align-items:center;justify-content:center;height:52px;padding:0 26px;font-weight:600;font-size:15px;border:1px solid transparent;transition:background .25s ease,color .25s ease,border-color .25s ease}
.hbtn.gold{background:#fff;border-color:#fff;color:var(--green-d)}
.hbtn.line{border-color:rgba(255,255,255,.55);color:#fff}
.hbtn.gold:hover,.hbtn.line:hover{background:var(--gold);border-color:var(--gold);color:var(--green-d)}
.hero-top{display:grid;grid-template-columns:1fr;gap:40px;align-items:start}
@media (min-width:900px){.hero-top{grid-template-columns:1fr 1fr;gap:56px;align-items:center}}
/* HEADSHOT SIZE: change --headshot-w (max width) to resize. Desktop and mobile are separate for easy tuning. */
.hero{--headshot-w:560px;--headshot-w-mobile:400px}
.hero-photo{width:100%;max-width:var(--headshot-w-mobile);justify-self:center;align-self:end;display:block;line-height:0}
@media (min-width:900px){.hero-photo{max-width:var(--headshot-w);justify-self:end}}
.hero-photo img{width:100%;height:auto;display:block;object-fit:contain;object-position:bottom}
/* divider the headshot stands on; the photo's bottom edge sits flush against it */
.hero-top{padding-bottom:0}
/* breathing room between the buttons and the divider (desktop; on mobile the grid gap already does this) */
@media (min-width:900px){.hero-copy{padding-bottom:clamp(32px,4vw,56px)}}
.hero-divider{position:relative;height:1px;background:rgba(255,255,255,.35);margin:0}
.hero-divider::before{content:"";position:absolute;left:0;top:-1px;width:56px;height:3px;background:var(--gold)}
.ph{width:100%;height:100%;border:1px dashed var(--green-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--green-2);background:rgba(255,255,255,.55);text-align:center;padding:16px}
.ph svg{width:96px;height:96px;opacity:.6}
h1{font-size:clamp(2.5rem,6.5vw,4.25rem);font-weight:600;line-height:.95;letter-spacing:-.04em;max-width:15ch;margin:0;text-wrap:balance}
h1 .w{display:inline-block;white-space:nowrap}
h1 .l{display:inline-block;animation:wave 5s ease-in-out infinite;animation-delay:calc(var(--i) * .06s)}
@keyframes wave{0%{color:#f3f8f5}9%{color:var(--gold)}18%,100%{color:#f3f8f5}}
.sub{font-size:clamp(16px,2vw,18px);color:rgba(255,255,255,.88);max-width:36rem;margin:28px 0 0;line-height:1.6}
.cta{display:inline-flex;align-items:stretch;margin-top:36px;border:1px solid var(--green-d);background:var(--green);color:#fff;
  transition:background .3s ease,color .3s ease,border-color .3s ease;height:46px}
.cta span.lab{display:flex;align-items:center;padding:0 22px;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.14em}
.cta span.dv{width:1px;background:color-mix(in srgb,currentColor 40%,transparent)}
.cta span.ar{width:44px;display:grid;place-items:center}
.cta svg{width:18px;height:18px;transition:transform .3s var(--ease)}
.cta:hover{background:var(--gold);border-color:var(--gold);color:var(--green-d)}
.cta:hover svg{transform:translateX(3px)}
.pre{opacity:0;transform:translateY(14px)}
.go{animation:rise .7s var(--ease) both;animation-delay:var(--d,0s)}
.shots .go{animation-duration:.8s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* figures: one consistent frame, whole image always visible */
.figbtn{position:relative;display:block;width:100%;padding:0;border:1px solid var(--line);background:var(--band);overflow:hidden;cursor:default}
.figbtn.r45{aspect-ratio:4/5}
.figbtn.r43{aspect-ratio:4/3}
.figbtn img{width:100%;height:100%;object-fit:contain;display:block}
.figbtn:hover,.figbtn:focus-visible{border-color:var(--green-2)}
.figtag{position:absolute;left:8px;top:8px;background:#fff;color:var(--ink);border:1px solid var(--line);padding:3px 7px;font-size:9px}
.figzoom{position:absolute;right:8px;bottom:8px;width:32px;height:32px;display:grid;place-items:center;background:#fff;color:var(--ink);border:1px solid var(--line);transition:background .25s ease,color .25s ease,border-color .25s ease}
.figzoom svg{width:16px;height:16px}
.figbtn:hover .figzoom,.figbtn:focus-visible .figzoom{background:var(--green);color:#fff;border-color:var(--green)}
.figcap{margin-top:10px;color:var(--muted);text-align:left}
.shots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2vw,20px);margin-top:clamp(48px,6vw,72px);align-items:start}
@media (max-width:560px){.figtag{left:4px;top:4px;padding:2px 4px;font-size:8px;letter-spacing:.1em}.figzoom{width:24px;height:24px;right:4px;bottom:4px}.figzoom svg{width:12px;height:12px}.figcap{font-size:8px;letter-spacing:.1em}}

/* work */
.grid2{display:grid;grid-template-columns:1fr;gap:48px 24px}
@media (min-width:768px){.grid2{grid-template-columns:1fr 1fr}}
.card-body{border-top:1px solid var(--line);margin-top:20px;padding-top:18px;display:flex;flex-direction:column;gap:12px}
.card-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.ptitle{font-size:1.25rem;font-weight:500;letter-spacing:-.02em;line-height:1.25;min-width:0}
.pmeta{display:flex;flex-direction:column;align-items:flex-end;color:var(--muted);text-align:right;flex:none}
.psum{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;padding:4px 8px;font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);line-height:1.4}
.empty{border:1px dashed var(--line);padding:40px 24px;text-align:center;color:var(--muted)}

/* expertise */
.acc{border-top:1px solid var(--line)}
.arow{border-bottom:1px solid var(--line)}
.ahead{width:100%;display:flex;align-items:center;gap:20px;padding-block:24px;text-align:left}
.aidx{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;color:var(--muted);width:2.5rem;flex:none}
.atitle{font-size:clamp(1.25rem,2.4vw,1.5rem);font-weight:500;letter-spacing:-.02em;flex:1;min-width:0;transition:color .25s ease}
.ahead:hover .atitle,.ahead[aria-expanded="true"] .atitle{color:var(--green-2)}
.chev{width:20px;height:20px;color:var(--muted);transition:transform .35s var(--ease);flex:none}
.ahead[aria-expanded="true"] .chev{transform:rotate(180deg)}
.apanel{display:grid;grid-template-rows:0fr;opacity:0;visibility:hidden;
  transition:grid-template-rows .38s var(--ease),opacity .28s ease,visibility 0s linear .38s}
.apanel.open{grid-template-rows:1fr;opacity:1;visibility:visible;transition-delay:0s}
.apin{overflow:hidden;min-height:0;display:flex;flex-direction:column;gap:18px}
.apin>:last-child{margin-bottom:28px}
.apin p{color:var(--muted);max-width:42rem}
@media (min-width:768px){.apin{padding-left:4rem}}

/* about */
.about{display:grid;grid-template-columns:minmax(0,1fr);gap:48px}
@media (min-width:900px){.about{grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(40px,5vw,64px)}
  .about .l{grid-column:span 7}.about .r{grid-column:span 5}}
.abody{display:flex;flex-direction:column;gap:20px;color:var(--muted);font-size:16px;line-height:1.7}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;border-top:1px solid var(--line);margin-top:44px;padding-top:28px}
.stat .mono{color:var(--muted);display:block;margin-bottom:8px}
.stat b{font-size:clamp(1.5rem,4vw,1.875rem);font-weight:600;letter-spacing:-.04em;line-height:1;color:var(--green)}

/* contact */
.tiles{display:grid;grid-template-columns:1fr;gap:1px;background:var(--line);border:1px solid var(--line)}
@media (min-width:768px){.tiles{grid-template-columns:1fr 1fr}}
.ctile{background:var(--bg);min-height:176px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;gap:28px;position:relative;transition:background .25s ease;min-width:0}
.ctile:hover{background:var(--tile-hover)}
.ctile .mono{color:var(--muted)}
.cval{font-size:clamp(1.25rem,2.6vw,1.5rem);font-weight:500;letter-spacing:-.02em;overflow-wrap:anywhere;padding-right:36px;line-height:1.25}
.tile-arrow{position:absolute;right:20px;bottom:24px;width:22px;height:22px;color:var(--muted);transition:transform .3s var(--ease),color .25s ease}
.ctile:hover .tile-arrow{transform:translate(3px,-3px);color:var(--green-2)}
.based{margin-top:20px;color:var(--muted)}

/* footer */
footer{background:var(--green);color:#fff;border-top:0}
.fgrid{display:grid;grid-template-columns:1fr;gap:40px;padding-block:64px}
@media (min-width:768px){.fgrid{grid-template-columns:5fr 3fr 4fr}}
.fgrid h3{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--gold);font-weight:500;margin-bottom:16px}
.fgrid ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:14px;color:rgba(255,255,255,.82)}
.fgrid li{min-width:0;overflow-wrap:anywhere}
.fgrid a{transition:color .2s ease}
.fgrid a:hover{color:var(--gold)}
.fname{display:flex;align-items:center;gap:12px;font-size:1.125rem;font-weight:600;letter-spacing:-.01em}
.fgrid p{color:rgba(255,255,255,.72);font-size:14px;max-width:22rem;margin-top:8px}
.fgrid p.mono{color:rgba(255,255,255,.6);max-width:none}
.fbar{border-top:1px solid rgba(255,255,255,.14)}
.fbar .wrap{display:flex;justify-content:space-between;gap:16px;padding-block:22px;flex-wrap:wrap;color:rgba(255,255,255,.65)}

/* social + github banner */
.hdr-in{gap:16px}
@media (min-width:768px){.hdr-in{gap:32px}}
.social{display:flex;gap:10px;flex:none}
.soc{width:38px;height:38px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.42);color:#fff;transition:background .25s ease,color .25s ease,border-color .25s ease}
.soc svg{width:18px;height:18px}
.soc:hover{background:var(--gold);border-color:var(--gold);color:var(--green-d)}
.gh-banner{margin-top:56px;background:var(--green);color:#fff;padding:28px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.gh-banner p{font-size:clamp(1rem,2.2vw,1.125rem);font-weight:600;letter-spacing:-.01em;min-width:0}
.gh-btn{display:inline-flex;align-items:center;height:48px;padding:0 24px;background:#fff;color:var(--green-d);font-weight:600;border:1px solid #fff;transition:background .25s ease,color .25s ease,border-color .25s ease}
.gh-btn:hover{background:var(--gold);border-color:var(--gold)}
@media (max-width:560px){.gh-banner{padding:24px 20px}.gh-btn{width:100%;justify-content:center}}

/* diagram viewer */
.lb{position:fixed;inset:0;z-index:100;background:rgba(244,248,246,.97);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);opacity:0;visibility:hidden;transition:opacity .28s ease,visibility 0s linear .28s}
.lb.open{opacity:1;visibility:visible;transition-delay:0s}
.lb-bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-left,0px));background:#fff;border-bottom:1px solid var(--line)}
.lb-cap{display:flex;flex-direction:column;min-width:0;flex:1 1 200px}
.lb-cap .mono{color:var(--green-2)}
.lb-cap b{font-weight:600;letter-spacing:-.01em;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-cap span.sub2{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-tools{display:flex;align-items:center;gap:8px}
.lbt{min-width:40px;height:40px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink);transition:background .2s ease,color .2s ease,border-color .2s ease}
.lbt:hover{background:var(--green);border-color:var(--green);color:#fff}
.lbt svg{width:18px;height:18px}
.lbt.txt{padding:0 12px;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.14em}
.lb-zoom{min-width:48px;text-align:center;color:var(--muted)}
.lb-stage{flex:1;min-height:0;overflow:auto;display:flex;padding:20px;touch-action:pan-x pan-y;overscroll-behavior:contain;position:relative}
.lb-stage img{margin:auto;flex:none;max-width:none;display:block;background:#fff;border:1px solid var(--line);cursor:zoom-in;user-select:none;-webkit-user-drag:none;
  opacity:0;transform:scale(.97);transition:opacity .3s ease,transform .35s var(--ease)}
.lb.open .lb-stage img{opacity:1;transform:none}
.lb-stage.zoomed img{cursor:grab}
.lb-stage.drag img{cursor:grabbing}
.lb-nav{position:absolute;top:50%;margin-top:-20px;width:44px;height:44px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;transition:background .2s ease,color .2s ease;z-index:2}
.lb-nav:hover{background:var(--green);color:#fff;border-color:var(--green)}
.lb-nav svg{width:20px;height:20px}
.lb-nav.prev{left:max(12px,env(safe-area-inset-left,0px))}.lb-nav.next{right:max(12px,env(safe-area-inset-right,0px))}
.lb-hint{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--muted);background:#fff;border-top:1px solid var(--line)}
@media (max-width:640px){.lb-hint{display:none}.lb-nav{top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin-top:0}.lb-stage{padding:12px}}

/* studio shared */
#studio{min-height:100vh}
.auth{min-height:100vh;display:grid;place-items:center;padding:40px max(16px,env(safe-area-inset-left,0px))}
.authbox{width:100%;max-width:400px;border:1px solid var(--line);background:var(--card);padding:32px;display:flex;flex-direction:column;gap:20px}
.authbrand{display:flex;align-items:center;gap:12px;background:var(--green);color:#fff;margin:-32px -32px 4px;padding:16px 32px;font-weight:600;letter-spacing:-.01em;font-size:17px}
.authbox h1{font-size:1.75rem;letter-spacing:-.035em;line-height:1.05;margin:0;text-align:left;max-width:none}
.authbox p{color:var(--muted);font-size:14px}
.lnk{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);text-decoration:underline;text-underline-offset:3px;transition:color .2s ease}
.lnk:hover{color:var(--green-2)}
.row-links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field label{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted)}
.field input,.field textarea{width:100%;background:#fff;border:1px solid var(--line);color:var(--ink);font:inherit;font-size:14px;padding:11px 12px;border-radius:0;line-height:1.5}
.field input{height:44px}
.field textarea{resize:vertical;min-height:80px}
.field input:focus,.field textarea:focus{outline:2px solid var(--green-2);outline-offset:-1px;border-color:var(--green-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;background:var(--green);color:#fff;border:1px solid var(--green);
  font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.14em;transition:background .25s ease,color .25s ease,border-color .25s ease;white-space:nowrap}
.btn:hover{background:var(--green-d);border-color:var(--green-d)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--green);border-color:var(--green)}
.btn.ghost:hover{background:var(--green);color:#fff}
.btn.sm{height:36px;padding:0 14px}
.msg{font-size:13px;min-height:1.2em}
.msg.err{color:var(--danger)}
.msg.ok{color:var(--ok)}
.shbar{background:var(--green);color:#fff}
.shin{max-width:1024px;margin:0 auto;padding-block:14px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-height:72px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.shin .who{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.shin .who b{font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.shin .who span{color:rgba(255,255,255,.72);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shin nav{display:flex;gap:20px;align-items:center}
.shin .lnk{color:rgba(255,255,255,.82)}.shin .lnk:hover{color:var(--gold)}
.shell{max-width:1024px;margin:0 auto;padding-top:8px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-bottom:80px}
.tabs{display:flex;gap:28px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:36px;-webkit-overflow-scrolling:touch}
.tab{padding:18px 0 16px;font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .2s ease}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--green);border-bottom-color:var(--green)}
.panel{display:flex;flex-direction:column;gap:24px;animation:rise .35s var(--ease) both}
.two{display:grid;grid-template-columns:1fr;gap:20px}
@media (min-width:640px){.two{grid-template-columns:1fr 1fr}}
.logo-row{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo-prev{width:80px;height:80px;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;background:var(--green);color:var(--gold);flex:none}
.logo-prev .ring{width:36px;height:36px}
.logo-prev img{width:100%;height:100%;object-fit:contain;padding:10px;background:#fff}
.note{color:var(--muted);font-size:13px}
.actions{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.xcard{border:1px solid var(--line);background:#fff;padding:20px;display:flex;flex-direction:column;gap:16px}
.xhead{display:flex;align-items:center;justify-content:space-between}
.icon-btn{width:36px;height:36px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);transition:color .2s ease,border-color .2s ease}
.icon-btn:hover{color:var(--danger);border-color:var(--danger)}
.icon-btn svg{width:16px;height:16px}
.plist{border:1px solid var(--line);background:#fff;list-style:none;margin:0;padding:0}
.plist li{display:flex;align-items:center;gap:16px;padding:12px 16px;border-top:1px solid var(--line)}
.plist li:first-child{border-top:0}
.plist .thumb{width:80px;height:60px;flex:none;border:1px solid var(--line);overflow:hidden;background:var(--band)}
.plist .thumb img{width:100%;height:100%;object-fit:contain}
.plist .t{flex:1;min-width:0}
.plist .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .t span{color:var(--muted)}
.h3m{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.18em;font-weight:500}
.up-prev{width:120px;height:90px;border:1px solid var(--line);overflow:hidden;background:var(--band);flex:none}
.up-prev img{width:100%;height:100%;object-fit:contain}
.noaccess{min-height:100vh;display:grid;place-items:center;text-align:center;padding:40px 24px}
.noaccess h1{font-size:2rem;margin:0 auto 12px}
.noaccess .actions{justify-content:center;margin-top:24px}
.noaccess .ring{width:30px;height:30px;margin:0 auto 20px;color:var(--green)}
.hid{display:none}
@media (prefers-reduced-motion:reduce){
  h1 .l,.go,.panel{animation:none!important}.pre{opacity:1;transform:none}
  .mpanel,.apanel,.lb,.lb-stage img,.burger svg,.navl::after,.chev,.cta svg,.tile-arrow,.mpanel a{transition:none!important}
}
</style>

<script>
(function(){
'use strict';

function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function $(s,r){return (r||document).querySelector(s)}

var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- sample content ---------- */
var SAMPLE={
  settings:{
    name:'Nicholas Walton',role:'Software Engineer',email:'nwalt9211@gmail.com',phone:'+61 468 444 897',location:'Gold Coast, Australia',logo:'',github:'https://github.com/nicwalt',linkedin:'https://www.linkedin.com/in/nicholas-cameron-walton/',
    heroTitle:'Software engineering, built to last.',

  ]
};
var S=load();
function load(){
  try{var r=JSON.parse(localStorage.getItem(KEY)||'null');
    if(r&&r.settings){var base=clone(SAMPLE.settings);for(var k in r.settings)base[k]=r.settings[k];
      return{settings:base,projects:Array.isArray(r.projects)?r.projects:clone(SAMPLE.projects)}}}catch(e){}

/* ---------- local image mapping ---------- */
// Keep all portfolio imagery in the same folder as this HTML file,
// named image1.avif through image8.avif. If preferred, the fallback also
// checks the ./src/ folder.
var IMAGE_FILES = {
  1:'image1.avif', 2:'image2.avif', 3:'image3.avif', 4:'image4.avif',
  5:'image5.avif', 6:'image6.avif', 7:'image7.avif', 8:'image8.avif'
};
// Compatibility for older saved content that used art:1, art:2, etc.
var LEGACY_IMAGE_MAP = {1:1, 2:2, 3:3, 4:4, 11:5, 12:6, 13:7, 20:8};
function src(v, w, h) {
  if (typeof v !== 'string') return v;
  var value = v.trim();
  var legacy = value.match(/^art:?([0-9]+)$/i);
  if (legacy) {
    var mapped = LEGACY_IMAGE_MAP[Number(legacy[1])];
    return mapped ? './' + IMAGE_FILES[mapped] : value;
  }
  var named = value.match(/^(?:\.\/)?image([1-8])(?:\.jpe?g)?$/i);
  if (named) return './' + IMAGE_FILES[Number(named[1])];
  return value;
}
function imageFallback(url) {
  var match = String(url || '').match(/^(?:\.\/)?image([1-8])\.avif$/i);
  if (!match) return '';
  var file = IMAGE_FILES[Number(match[1])];
  return ' onerror="if(this.dataset.fallbackTried!==\'1\'){this.dataset.fallbackTried=\'1\';this.src=\'./src/' + file + '\'}else{this.onerror=null;this.style.display=\'none\'}"';
}

var GH_SVG='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>';

function setMenu(open){
  var p=$('#mpanel'),b=$('[data-menu]');if(!p||!b)return;
  p.classList.toggle('open',open);b.setAttribute('aria-expanded',String(open));b.setAttribute('aria-label',open?'Close menu':'Open menu');
}
function menuOpen(){var p=$('#mpanel');return !!p&&p.classList.contains('open')}
if(window.matchMedia){var mq=window.matchMedia('(min-width:768px)');var mqh=function(){if(mq.matches)setMenu(false)};if(mq.addEventListener)mq.addEventListener('change',mqh);else if(mq.addListener)mq.addListener(mqh)}

document.addEventListener('click',function(e){
  var site=$('#site');
  if(menuOpen()&&!e.target.closest('.hdr'))setMenu(false);
  var fg=e.target.closest('[data-fig]');
  if(fg&&site.contains(fg)){openLB(parseInt(fg.getAttribute('data-fig'),10),fg);return}
  var sc=e.target.closest('[data-scroll]');
  if(sc&&site.contains(sc)){e.preventDefault();var id=sc.getAttribute('data-scroll');
    var t=id==='top'?null:document.getElementById(id);
    if(id==='top')window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});else if(t)t.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});
    setMenu(false);return}
  var mb=e.target.closest('[data-menu]');
  if(mb&&site.contains(mb)){setMenu(!menuOpen());return}
  var ac=e.target.closest('[data-acc]');
  if(ac){var i=parseInt(ac.getAttribute('data-acc'),10);openIdx=(openIdx===i)?-1:i;
    $$('.ahead').forEach(function(b,k){b.setAttribute('aria-expanded',String(k===openIdx));document.getElementById('ap'+k).classList.toggle('open',k===openIdx)});return}
});

/* ---------- diagram viewer ---------- */
var lb=$('#lb'),stage=$('#lb-stage'),limg=$('#lb-img'),zoomEl=$('#lb-zoom');
var LB={open:false,i:0,z:1,trig:null,scrollY:0};
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function layout(){
  var cs=getComputedStyle(stage),px=parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight),py=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
  var aw=Math.max(40,stage.clientWidth-px),ah=Math.max(40,stage.clientHeight-py);
  var nw=limg.naturalWidth||4,nh=limg.naturalHeight||3,r=nw/nh;
  var fw=Math.min(aw,ah*r),fh=fw/r;
  limg.style.width=(fw*LB.z)+'px';limg.style.height=(fh*LB.z)+'px';
  zoomEl.textContent=Math.round(LB.z*100)+'%';stage.classList.toggle('zoomed',LB.z>1);
}
function zoomTo(nz,cx,cy){
  nz=clamp(nz,1,6);if(Math.abs(nz-LB.z)<.001)return;
  var sr=stage.getBoundingClientRect(),ir=limg.getBoundingClientRect();
  if(cx==null||cx<ir.left||cx>ir.right){cx=ir.left+ir.width/2}
  if(cy==null||cy<ir.top||cy>ir.bottom){cy=ir.top+ir.height/2}
  var fx=(cx-ir.left)/ir.width,fy=(cy-ir.top)/ir.height;
  LB.z=nz;layout();
  var nr=limg.getBoundingClientRect();
  stage.scrollLeft+=(nr.left+fx*nr.width)-cx;stage.scrollTop+=(nr.top+fy*nr.height)-cy;
}
function showFig(i){
  var n=FIGS.length;if(!n)return;
  LB.i=(i+n)%n;LB.z=1;var f=FIGS[LB.i];
  $('#lb-count').textContent='Fig. '+pad2(LB.i+1)+' of '+pad2(n);
  $('#lb-title').textContent=f.title;$('#lb-sub').textContent=f.sub;
  limg.alt=f.title+' — enlarged diagram';
  limg.onload=function(){layout()};
  limg.src=f.src;stage.scrollLeft=0;stage.scrollTop=0;layout();
  var multi=n>1;$$('.lb-nav').forEach(function(b){b.hidden=!multi});
}
function openLB(i,trig){
  if(LB.open)return;
  LB.open=true;LB.trig=trig||null;LB.scrollY=window.scrollY;
  document.documentElement.style.overflow='hidden';
  lb.setAttribute('aria-hidden','false');showFig(i);
  requestAnimationFrame(function(){lb.classList.add('open');layout();var c=$('[data-lb="close"]');if(c)c.focus({preventScroll:true})});
}
function closeLB(){
  if(!LB.open)return;LB.open=false;
  lb.classList.remove('open');lb.setAttribute('aria-hidden','true');
  document.documentElement.style.overflow='';
  window.scrollTo(0,LB.scrollY);
  if(LB.trig&&document.body.contains(LB.trig)){try{LB.trig.focus({preventScroll:true})}catch(e){}}
}
lb.addEventListener('click',function(e){
  var b=e.target.closest('[data-lb]');if(!b)return;
  var a=b.getAttribute('data-lb');
  if(a==='close')closeLB();else if(a==='in')zoomTo(LB.z*1.4);else if(a==='out')zoomTo(LB.z/1.4);
  else if(a==='fit'){LB.z=1;layout();stage.scrollLeft=0;stage.scrollTop=0}
  else if(a==='prev')showFig(LB.i-1);else if(a==='next')showFig(LB.i+1);
});
stage.addEventListener('wheel',function(e){e.preventDefault();zoomTo(LB.z*Math.exp(-e.deltaY*(e.ctrlKey?.01:.0018)),e.clientX,e.clientY)},{passive:false});
var ptr={},pinch=null,panStart=null,moved=false;
stage.addEventListener('pointerdown',function(e){
  ptr[e.pointerId]={x:e.clientX,y:e.clientY};moved=false;
  var ids=Object.keys(ptr);
  if(ids.length===2){var a=ptr[ids[0]],b=ptr[ids[1]];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:LB.z};panStart=null}
  else if(e.pointerType==='mouse'&&e.button===0){panStart={x:e.clientX,y:e.clientY,l:stage.scrollLeft,t:stage.scrollTop}}
});
stage.addEventListener('pointermove',function(e){
  if(!ptr[e.pointerId])return;ptr[e.pointerId]={x:e.clientX,y:e.clientY};
  var ids=Object.keys(ptr);
  if(pinch&&ids.length===2){var a=ptr[ids[0]],b=ptr[ids[1]];zoomTo(pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d,(a.x+b.x)/2,(a.y+b.y)/2);moved=true;return}
  if(panStart){var dx=e.clientX-panStart.x,dy=e.clientY-panStart.y;
    if(Math.abs(dx)+Math.abs(dy)>4)moved=true;
    if(LB.z>1&&moved){stage.scrollLeft=panStart.l-dx;stage.scrollTop=panStart.t-dy;stage.classList.add('drag')}}
});
function endPtr(e){delete ptr[e.pointerId];if(Object.keys(ptr).length<2)pinch=null;panStart=null;stage.classList.remove('drag')}
stage.addEventListener('pointerup',endPtr);stage.addEventListener('pointercancel',endPtr);
stage.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse')endPtr(e)});
stage.addEventListener('click',function(e){
  if(moved){moved=false;return}
  if(e.target===limg){if(LB.z>1){LB.z=1;layout();stage.scrollLeft=0;stage.scrollTop=0}else zoomTo(2.5,e.clientX,e.clientY)}
  else if(e.target===stage)closeLB();
});
window.addEventListener('resize',function(){if(LB.open)layout()});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(LB.open){e.preventDefault();closeLB()}else if(menuOpen()){setMenu(false);var mb=$('[data-menu]');if(mb)mb.focus()}return}
  if(!LB.open)return;
  if(e.key==='ArrowLeft'){e.preventDefault();showFig(LB.i-1)}
  else if(e.key==='ArrowRight'){e.preventDefault();showFig(LB.i+1)}
  else if(e.key==='+'||e.key==='='){e.preventDefault();zoomTo(LB.z*1.4)}
  else if(e.key==='-'||e.key==='_'){e.preventDefault();zoomTo(LB.z/1.4)}
  else if(e.key==='0'){e.preventDefault();LB.z=1;layout()}
  else if(e.key==='Tab'){
    var f=$$('button',lb).filter(function(b){return !b.hidden});if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  }
});

function noAccessHTML(){return '<div class="noaccess"><div>'+RING+'<h1>This account can&rsquo;t edit the studio.</h1><p class="muted">You&rsquo;re signed in as '+esc(session.email)+', which isn&rsquo;t an admin account.</p><div class="actions"><a class="btn" href="#" data-go="">View site</a><button class="btn ghost" type="button" data-act="signout">Sign out</button></div></div></div>'}

function renderStudio(){
  var el=$('#studio');
  el.innerHTML=!session?authHTML():(!session.admin?noAccessHTML():shellHTML());
  document.title=session&&session.admin?'Studio — '+S.settings.name:'Studio sign-in';
}

function say(id,text,kind){var m=document.getElementById(id);if(m){m.textContent=text;m.className='msg '+(kind||'')}}
function setBusy(id,busy,label,idle){var b=document.getElementById(id);if(b){b.disabled=busy;b.textContent=busy?label:idle}}

function saveBrand(){
  var v={name:$('#f-name').value.trim(),role:$('#f-role').value.trim(),email:$('#f-email').value.trim(),phone:$('#f-phone').value.trim(),location:$('#f-loc').value.trim(),github:$('#f-gh').value.trim(),linkedin:$('#f-li').value.trim()};
  if(!v.name)return say('brand-msg','Enter a name.','err');
  if(!v.role)return say('brand-msg','Enter a role or tagline.','err');
  if(!EMAIL.test(v.email))return say('brand-msg','Enter a valid email address.','err');
  if(!PHONE.test(v.phone))return say('brand-msg','Enter a phone number using digits, spaces, + ( ) - only.','err');
  if(!v.location)return say('brand-msg','Enter a location.','err');
  if(!/^https?:\/\/\S+$/i.test(v.github))return say('brand-msg','Enter your GitHub link, starting with https://','err');
  if(!/^https?:\/\/\S+$/i.test(v.linkedin))return say('brand-msg','Enter your LinkedIn link, starting with https://','err');
  setBusy('brand-btn',true,'Saving…','Save brand details');
  for(var k in v)S.settings[k]=v[k];
  var ok=persist();
  setTimeout(function(){setBusy('brand-btn',false,'','Save brand details');
    say('brand-msg',ok?'Saved. The public site now shows these details.':'Saved for this visit, but the browser could not store it.',ok?'ok':'err')},250);
}
function saveContent(){
  var v={heroTitle:$('#c-title').value.trim(),heroSub:$('#c-sub').value.trim(),aboutHeading:$('#c-ah').value.trim(),aboutBody:$('#c-ab').value.trim()};
  if(!v.heroTitle)return say('content-msg','Enter a hero headline.','err');
  if(!v.heroSub)return say('content-msg','Enter a hero subheadline.','err');
  if(!v.aboutHeading)return say('content-msg','Enter an about heading.','err');
  if(!v.aboutBody)return say('content-msg','Enter the about text.','err');
  var groups=[];
  for(var i=0;i<draftExp.length;i++){var g=draftExp[i];
    if(!g.title.trim())return say('content-msg','Service '+(i+1)+' needs a title.','err');
    groups.push({title:g.title.trim(),description:g.description.trim(),items:g.items.split(',').map(function(x){return x.trim()}).filter(Boolean)})}
  setBusy('content-btn',true,'Saving…','Save content');
  for(var k in v)S.settings[k]=v[k];S.settings.expertise=groups;
  var ok=persist();
  setTimeout(function(){setBusy('content-btn',false,'','Save content');
    say('content-msg',ok?'Saved. The public site now shows this content.':'Saved for this visit, but the browser could not store it.',ok?'ok':'err')},250);
}
function addProject(){
  var t=wd.title.trim(),c=wd.category.trim(),y=wd.year.trim(),su=wd.summary.trim(),te=wd.tech.trim();
  if(!t)return say('work-msg','Enter a title.','err');
  if(!c)return say('work-msg','Enter a category.','err');
  if(!/^\d{4}$/.test(y))return say('work-msg','Enter a four-digit year.','err');
  if(!wd.image)return say('work-msg','Upload an image for the project.','err');
  if(!su)return say('work-msg','Enter a one-line summary.','err');
  if(!te)return say('work-msg','Enter at least one technology.','err');
  setBusy('proj-btn',true,'Adding…','Add project');
  var max=S.projects.reduce(function(m,p){return Math.max(m,p.sort)},0);
  S.projects.push({id:'p'+Date.now(),sort:max+1,title:t,category:c,year:y,summary:su,tech:te,image:wd.image});
  var ok=persist();
  if(!ok){S.projects.pop()}
  setTimeout(function(){
    if(ok){wd=blankWork();renderStudio();say('work-msg','Project added. It now appears on the public site.','ok')}
    else{setBusy('proj-btn',false,'','Add project');say('work-msg','The browser could not store that image. Try a smaller file.','err')}},250);
}
function readImage(file,max,mime){return new Promise(function(res,rej){
  if(file.type==='image/svg+xml'){var fr=new FileReader();fr.onload=function(){res(fr.result)};fr.onerror=rej;fr.readAsDataURL(file);return}
  var url=URL.createObjectURL(file),im=new Image();
  im.onload=function(){var k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
    var x=c.getContext('2d');if(mime==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL(mime,.85))};
  im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('unreadable'))};im.src=url})}

document.addEventListener('click',function(e){
  var st=$('#studio');if(!st||!st.contains(e.target))return;
  var gt=e.target.closest('[data-go]');
  if(gt){e.preventDefault();location.hash=gt.getAttribute('data-go');return}
  var au=e.target.closest('[data-auth]');
  if(au){e.preventDefault();authView=au.getAttribute('data-auth');authErr='';authMsg='';renderStudio();return}
  var tb=e.target.closest('[data-tab]');
  if(tb){tab=tb.getAttribute('data-tab');if(tab==='content')draftExp=null;renderStudio();return}
  var a=e.target.closest('[data-act]');if(!a)return;
  var act=a.getAttribute('data-act');
  if(act==='signout'){setSession(null);authView='signin';authMsg='';authErr='';renderStudio()}
  else if(act==='save-brand')saveBrand();
  else if(act==='save-content')saveContent();
  else if(act==='proj-add')addProject();
  else if(act==='logo')$('#logo-file').click();
  else if(act==='portrait')$('#p-file').click();
  else if(act==='img')$('#w-file').click();
  else if(act==='exp-add'){draftExp.push({title:'',description:'',items:''});renderStudio();var l=$$('[data-k="title"]');if(l.length)l[l.length-1].focus()}
  else if(act==='exp-del'){draftExp.splice(parseInt(a.getAttribute('data-i'),10),1);renderStudio()}
  else if(act==='proj-del'){var id=a.getAttribute('data-id');S.projects=S.projects.filter(function(p){return p.id!==id});persist();renderStudio()}
  else if(act==='reset'){if(!resetArm){resetArm=true;renderStudio();return}resetArm=false;S=clone(SAMPLE);draftExp=null;persist();renderStudio()}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.hasAttribute&&t.hasAttribute('data-exp')){draftExp[parseInt(t.getAttribute('data-exp'),10)][t.getAttribute('data-k')]=t.value}
  else if(t.hasAttribute&&t.hasAttribute('data-wd')){wd[t.getAttribute('data-wd')]=t.value}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='logo-file'&&t.files[0]){var f=t.files[0];
    if(f.size>3*1024*1024){say('logo-msg','That file is over 3 MB. Choose a smaller logo.','err');return}
    setBusy('logo-btn',true,'Uploading…','Upload logo');
    readImage(f,320,'image/png').then(function(d){var old=S.settings.logo;S.settings.logo=d;
      if(persist()){$('#logo-prev').innerHTML='<img src="'+esc(d)+'" alt="">';say('logo-msg','Logo uploaded. It shows in the site header now.','ok')}
      else{S.settings.logo=old;say('logo-msg','The browser could not store that logo. Try a smaller file.','err')}
      setBusy('logo-btn',false,'','Upload logo')}).catch(function(){setBusy('logo-btn',false,'','Upload logo');say('logo-msg','That file could not be read as an image.','err')});
    t.value='';
  }
  if(t.id==='p-file'&&t.files[0]){var pf=t.files[0];
    if(pf.size>8*1024*1024){say('p-msg','That file is over 8 MB. Choose a smaller photo.','err');return}
    setBusy('p-btn',true,'Uploading…','Upload your photo');
    readImage(pf,1200,pf.type==='image/jpeg'?'image/jpeg':'image/png').then(function(d){var old=S.settings.portrait;S.settings.portrait=d;
      if(persist()){$('#p-prev').innerHTML='<img src="'+esc(d)+'" alt="">';say('p-msg','Photo uploaded. It shows on the first screen now.','ok')}
      else{S.settings.portrait=old;say('p-msg','The browser could not store that photo. Try a smaller file.','err')}
      setBusy('p-btn',false,'','Upload your photo')}).catch(function(){setBusy('p-btn',false,'','Upload your photo');say('p-msg','That file could not be read as an image.','err')});
    t.value='';
  }
  if(t.id==='w-file'&&t.files[0]){var g=t.files[0];
    if(g.size>8*1024*1024){say('w-img-note','Choose an image under 8 MB.','err');return}
    setBusy('w-img-btn',true,'Uploading…','Upload image');
    readImage(g,1400,'image/jpeg').then(function(d){wd.image=d;$('#w-prev').innerHTML='<img src="'+esc(d)+'" alt="Preview">';$('#w-img-note').textContent='Image ready.';setBusy('w-img-btn',false,'','Upload image')})
      .catch(function(){setBusy('w-img-btn',false,'','Upload image');$('#w-img-note').textContent='That file could not be read as an image.'});
    t.value='';
  }
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  var kind=f.getAttribute('data-form'),em=f.querySelector('#a-email')?f.querySelector('#a-email').value.trim():authEmail;
  var pw=f.querySelector('#a-pass')?f.querySelector('#a-pass').value:'';
  authErr='';authMsg='';
  if(kind==='signin'){authEmail=em;
    if(!EMAIL.test(em)){authErr='Enter a valid email address.'}
    else if(!pw){authErr='Enter your password.'}
    else if(/2fa/i.test(em)){authView='twofactor'}
    else{setSession(em)}}
  else if(kind==='register'){authEmail=em;
    if(!EMAIL.test(em))authErr='Enter a valid email address.';
    else if(pw.length<8)authErr='Use a password of at least 8 characters.';
    else authView='code'}
  else if(kind==='code'||kind==='twofactor'){
    if(!/^\d{6}$/.test(f.querySelector('#a-code').value.trim()))authErr='Enter the 6-digit code.';
    else{setSession(authEmail);authView='signin'}}
  else if(kind==='forgot'){authEmail=em;
    if(!EMAIL.test(em))authErr='Enter a valid email address.';
    else authMsg='If that address has an account, a reset link is on its way.'}
  else if(kind==='reset'){var p2=f.querySelector('#a-pass2').value;
    if(pw.length<8)authErr='Use a password of at least 8 characters.';
    else if(pw!==p2)authErr='The two passwords don’t match.';
    else{authView='signin';authMsg='Password updated. Sign in with the new one.'}}
  renderStudio();
});

/* ---------- routing ---------- */
function route(){
  var studio=location.hash==='#studio';
  closeLB();
  $('#site').hidden=studio;$('#studio').hidden=!studio;
  if(studio){renderStudio()}else{renderSite()}
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
})();
</script>
